<!doctype html>
<html><head><meta charset="utf-8"><title>D1Book</title></head>
<body><x-dc>
<helmet><style>
  body { margin: 0; background: transparent }
  .kicker { font-family: var(--font-body); font-size: 13px; line-height: 20px; letter-spacing: 3px;
            text-transform: uppercase; color: var(--copper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  :lang(en) .kicker { letter-spacing: 1px }
  .sheet { background-color: var(--paper); border: 2px solid var(--ink); box-shadow: 8px 8px 0px 0px #092e2899 }
  .tab { background-color: var(--paper-old); border: 1px solid var(--ink); border-bottom: 0px solid var(--ink);
         transition: background-color 120ms linear }
  .tab:hover { background-color: #fff3cf }
  .tab.sel { background-color: var(--ink) }
  .tab-t { font-family: var(--font-display); font-size: 18px; line-height: 40px; font-weight: 700; color: var(--ink-deep);
           text-align: center; white-space: nowrap }
  :lang(en) .tab-t { font-size: 16px }
  .tab.sel .tab-t { color: var(--paper) }
  .x-btn { background-color: var(--ink); transition: background-color 120ms linear }
  .x-btn:hover { background-color: var(--copper) }

  /* The evidence list: one row per item (evidence and the mind-game card). */
  .row { background-color: #fbf8ef; border-bottom: 1px dashed #123a3166; border-left: 4px solid #9ea7aa;
         transition: background-color 120ms linear }
  .row:hover { background-color: #fff3cf }
  .row.psy { border-left-color: #6b3a7a }
  .row.sel { background-color: var(--ink) }
  .row-t { font-family: var(--font-display); font-size: 15px; line-height: 34px; font-weight: 700; color: var(--ink-deep);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  :lang(en) .row-t { font-size: 13px }
  .row.sel .row-t { color: var(--paper) }
  .mark { font-family: var(--font-body); font-size: 11px; line-height: 34px; color: var(--copper); white-space: nowrap; text-align: right }
  .row.sel .mark { color: var(--lamp-gold) }
  .new { border-radius: 4px; background-color: var(--vermilion) }

  .d-name { font-family: var(--font-display); font-size: 26px; line-height: 34px; font-weight: 700; color: var(--ink-deep) }
  :lang(en) .d-name { font-size: 22px; line-height: 30px }
  .d-desc { font-family: var(--font-body); font-size: 16px; line-height: 25px; color: var(--ink) }
  .res { background-color: #fff8e6; border-left: 3px solid var(--lamp-gold) }
  .res-k { font-family: var(--font-display); font-size: 13px; line-height: 18px; font-weight: 700; color: #9a5a14; letter-spacing: 2px }
  .res-t { font-family: var(--font-body); font-size: 15px; line-height: 22px; color: var(--ink-deep) }
  .abtn { background-color: var(--vermilion); border: 1px solid #5c1913; box-shadow: 2px 2px 0px 0px #092e2866;
          transition: background-color 120ms linear }
  .abtn:hover { background-color: #d23f35 }
  .abtn.off { background-color: #5b6662; border-color: #5b6662 }
  .abtn-t { font-family: var(--font-display); font-size: 16px; line-height: 36px; font-weight: 700; color: var(--paper); text-align: center; white-space: nowrap }
  :lang(en) .abtn-t { font-size: 14px }
  .left-t { font-family: var(--font-body); font-size: 14px; line-height: 36px; color: var(--copper); white-space: nowrap }
  .remark { background-color: var(--paper-old); border-left: 3px solid var(--copper) }
  .spk { font-family: var(--font-body); font-size: 13px; line-height: 18px; letter-spacing: 2px; font-weight: 700; color: var(--copper) }
  .remark-t { font-family: var(--font-body); font-size: 15px; line-height: 23px; color: var(--ink-deep) }
  :lang(en) .remark-t { font-size: 14px; line-height: 20px }

  /* Private view: one of the evidence's claims as a note (or none). */
  .opt { background-color: #fbf8ef; border: 1px solid #123a3166; border-left: 4px solid #123a3166; transition: background-color 120ms linear }
  .opt:hover { background-color: #fff3cf }
  .opt.sel { background-color: #fff3cf; border: 2px solid var(--vermilion); border-left: 4px solid var(--vermilion) }
  .opt-t { font-family: var(--font-display); font-size: 14px; line-height: 28px; font-weight: 700; color: var(--ink-deep);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  :lang(en) .opt-t { font-size: 13px }

  /* Notes on people and observations. */
  .note { background-color: #fbf8ef; border-left: 4px solid var(--copper); border-bottom: 1px dashed #123a3166 }
  .note-k { font-family: var(--font-body); font-size: 12px; line-height: 18px; letter-spacing: 2px; color: var(--copper); white-space: nowrap }
  .note-n { font-family: var(--font-display); font-size: 17px; line-height: 24px; font-weight: 700; color: var(--ink-deep) }
  .note-t { font-family: var(--font-body); font-size: 15px; line-height: 23px; color: var(--ink) }
  :lang(en) .note-t { font-size: 14px; line-height: 21px }
  .empty { font-family: var(--font-body); font-size: 15px; line-height: 24px; font-style: italic; color: #123a3199 }
</style></helmet>
<div id="d1book" data-xt-uiscale="fit" tabindex="0" autofocus key-activation="none"
     data-xt-port='tab:number in = 0; cards:list&lt;struct{id: string, name: string, psy: bool, sel: bool, mark: string, isnew: bool}&gt; in = []; has_sel:bool in = false; sel_kind:string in = ""; sel_name:string in = ""; sel_desc:string in = ""; appraisable:bool in = false; appraised:bool in = false; can_appraise:bool in = false; appr_left:string in = ""; sel_result:string in = ""; remark_speaker:string in = ""; remark:string in = ""; remark_seq:number in = 0; opts:list&lt;struct{id: string, label: string, sel: bool}&gt; in = []; pnotes:list&lt;struct{kind: string, name: string, text: string}&gt; in = []; pick_tab:number out = 0; pick_card:string out = ""; pick_opt:string out = ""; appraise:event out; close:event out; settings:event out'
     data-xt-trigger="show:play(in); key(Escape):emit(close); key(Tab):emit(close); key(Backspace):emit(close); key(F1):emit(settings)"
     style="position: relative; width: 1280px; height: 720px; overflow: hidden;">

  <div id="veil" data-xt-trigger="click(left):emit(close)" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; background-color: #092e28b3;"></div>

  <div id="book" class="sheet" data-xt-timeline="in: 0 opacity 0, 0 transform translate(0px, 14px), 220ms ease-out opacity 1, 220ms ease-out transform translate(0px, 0px)"
       style="position: absolute; left: calc(50% - 560px); top: calc(50% - 320px); width: 1120px; height: 640px;">
    <!-- Tabs: the evidence list, notes on people (a separate page: they take no room and are never presented). -->
    <div id="tab-ev" class="tab" data-xt-bind="class.sel=tab | eq(0)" data-xt-trigger="click(left):set(pick_tab, 0)"
         style="position: absolute; left: 24px; top: 16px; width: 220px; height: 40px;">
      <div id="tab-ev-t" class="tab-t" data-xt-key="UI_V2_EVLIST" style="position: absolute; left: 0px; top: 0px; width: 220px; height: 40px;">證物清單</div>
    </div>
    <div id="tab-pn" class="tab" data-xt-bind="class.sel=tab | eq(1)" data-xt-trigger="click(left):set(pick_tab, 1)"
         style="position: absolute; left: 252px; top: 16px; width: 220px; height: 40px;">
      <div id="tab-pn-t" class="tab-t" data-xt-key="UI_V2_NOTES_PAGE" style="position: absolute; left: 0px; top: 0px; width: 220px; height: 40px;">人物筆記</div>
    </div>
    <div id="x-btn" class="x-btn" data-xt-trigger="click(left):emit(close)" style="position: absolute; left: 1060px; top: 16px; width: 40px; height: 40px;">
      <div id="x-t" style="position: absolute; left: 0px; top: 0px; width: 40px; height: 40px; text-align: center; font-size: 22px; line-height: 38px; color: #f3eedf;">×</div>
    </div>
    <div id="tab-rule" style="position: absolute; left: 24px; top: 56px; width: 1076px; height: 3px; background-color: #123a31;"></div>

    <!-- Evidence page. -->
    <div id="page-ev" data-xt-bind="display=tab | eq(0)" style="position: absolute; left: 0px; top: 60px; width: 1120px; height: 580px;">
      <div id="cards" data-xt-repeat="cards" style="position: absolute; left: 24px; top: 16px; width: 330px; height: 540px; display: flex; flex-direction: column; gap: 4px;">
        <div id="card" class="row" data-xt-bind="class.sel=item(sel); class.psy=item(psy)" data-xt-trigger="click(left):set(pick_card, item(id))"
             style="position: relative; width: 330px; height: 36px; flex-shrink: 0;">
          <div id="card-t" class="row-t" data-xt-bind="text=item(name)" style="position: absolute; left: 12px; top: 0px; width: 220px; height: 34px;">黃銅文件筒（空）</div>
          <div id="card-m" class="mark" data-xt-bind="text=item(mark)" style="position: absolute; left: 216px; top: 0px; width: 96px; height: 34px;">已鑑定</div>
          <div id="card-new" class="new" data-xt-bind="display=item(isnew)" style="position: absolute; left: 318px; top: 4px; width: 8px; height: 8px;"></div>
        </div>
      </div>

      <div id="detail" data-xt-bind="display=has_sel" style="position: absolute; left: 380px; top: 16px; width: 716px; height: 548px;">
        <div id="d-kind" class="kicker" data-xt-bind="text=sel_kind" style="position: absolute; left: 0px; top: 0px; width: 400px; height: 20px;">證物</div>
        <!-- Fixed slots (name, description up to 4 lines, appraisal, Arthur's line, private view). -->
        <div id="d-name" class="d-name" data-xt-bind="text=sel_name" style="position: absolute; left: 0px; top: 22px; width: 716px; height: 34px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">黃銅文件筒（空）</div>
        <div id="d-desc" class="d-desc" data-xt-bind="text=sel_desc" style="position: absolute; left: 0px; top: 62px; width: 716px; height: 100px;">書桌上的黃銅文件筒，蓋子鎖著，裡面是空的。鎖孔周圍光亮，沒有明顯的刮痕。</div>
        <!-- Appraisal: the button with the count left, or the result once done. -->
        <div id="appr-row" data-xt-bind="display=appraisable" style="position: absolute; left: 0px; top: 166px; width: 716px; height: 52px;">
          <div id="appr-btn" class="abtn" data-xt-bind="class.off=can_appraise | not; display=appraised | not" data-xt-trigger="click(left):if port(can_appraise) eq true emit(appraise)"
               style="position: absolute; left: 0px; top: 0px; width: 220px; height: 36px;">
            <div id="appr-btn-t" class="abtn-t" data-xt-key="UI_V2_APPRAISE" style="position: absolute; left: 0px; top: 0px; width: 220px; height: 36px;">請亞瑟鑑定</div>
          </div>
          <div id="appr-left" class="left-t" data-xt-bind="text=appr_left; display=appraised | not" style="position: absolute; left: 236px; top: 0px; width: 400px; height: 36px;">鑑定 剩 1 次</div>
          <div id="res" class="res" data-xt-bind="display=appraised" style="position: absolute; left: 0px; top: 0px; width: 716px; height: 52px;">
            <div id="res-k" class="res-k" data-xt-key="UI_V2_APPRAISED" style="position: absolute; left: 12px; top: 5px; width: 692px; height: 18px;">已鑑定</div>
            <div id="res-t" class="res-t" data-xt-bind="text=sel_result" style="position: absolute; left: 12px; top: 25px; width: 692px; height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">鎖完好；用原配鑰匙開；鎖芯無油</div>
          </div>
        </div>
        <div id="remark" class="remark" data-xt-bind="display=remark | ne('')" data-xt-trigger="port(remark_seq):play(rm-in)"
             data-xt-timeline="rm-in: 0 opacity 0, 260ms ease-out opacity 1"
             style="position: absolute; left: 0px; top: 224px; width: 716px; height: 120px;">
          <div id="remark-spk" class="spk" data-xt-bind="text=remark_speaker" style="position: absolute; left: 12px; top: 6px; width: 692px; height: 18px;">亞瑟</div>
          <div id="remark-t" class="remark-t" data-xt-bind="text=remark" style="position: absolute; left: 12px; top: 26px; width: 692px; height: 92px;">「鎖芯完好，一道撬痕也沒有。」</div>
        </div>
        <div id="pv-k" class="kicker" data-xt-key="UI_V2_PRIVATE_VIEW" style="position: absolute; left: 0px; top: 352px; width: 716px; height: 20px;">私下的看法</div>
        <div id="opts" data-xt-repeat="opts" style="position: absolute; left: 0px; top: 374px; width: 716px; height: 174px; display: flex; flex-direction: column; gap: 4px;">
          <div id="opt" class="opt" data-xt-bind="class.sel=item(sel)" data-xt-trigger="click(left):set(pick_opt, item(id))"
               style="position: relative; width: 716px; height: 30px; flex-shrink: 0;">
            <div id="opt-t" class="opt-t" data-xt-bind="text=item(label)" style="position: absolute; left: 12px; top: 0px; width: 690px; height: 28px;">用原配鑰匙開的</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Notes page. -->
    <div id="page-pn" data-xt-bind="display=tab | eq(1)" style="position: absolute; left: 0px; top: 60px; width: 1120px; height: 580px;">
      <div id="pn-desc" class="empty" data-xt-key="UI_V2_NOTES_DESC" style="position: absolute; left: 24px; top: 12px; width: 1076px; height: 24px;">不佔名額，也不能當證物出示。</div>
      <div id="pnotes" data-xt-repeat="pnotes" style="position: absolute; left: 24px; top: 44px; width: 1076px; height: 520px; display: flex; flex-direction: column; gap: 6px;">
        <div id="pnote" class="note" style="width: 1076px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 6px 14px 8px 14px;">
          <div id="pnote-k" class="note-k" data-xt-bind="text=item(kind)" style="width: 1048px; height: 18px; flex-shrink: 0;">人物筆記</div>
          <div id="pnote-n" class="note-n" data-xt-bind="text=item(name)" style="width: 1048px; flex-shrink: 0;">懷錶鏈上的墜子</div>
          <div id="pnote-t" class="note-t" data-xt-bind="text=item(text)" style="width: 1048px; flex-shrink: 0;">塞德里克的懷錶鏈上掛著三個小墜子。</div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script></body></html>
