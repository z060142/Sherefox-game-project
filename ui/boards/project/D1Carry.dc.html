<!doctype html>
<html><head><meta charset="utf-8"><title>D1Carry</title></head>
<body><x-dc>
<helmet><style>
  body { margin: 0; background: #092e28 }
  .kicker { font-family: var(--font-body); font-size: 13px; line-height: 20px; letter-spacing: 3px;
            text-transform: uppercase; color: var(--copper); white-space: nowrap }
  :lang(en) .kicker { letter-spacing: 1px }
  .sheet { background-color: #f3eedff2; border-top: 4px solid var(--ink); border-bottom: 1px solid var(--ink);
           box-shadow: 6px 6px 0px 0px #092e2899 }
  .h1 { font-family: var(--font-display); font-size: 28px; line-height: 38px; font-weight: 700; color: var(--ink-deep); white-space: nowrap }
  :lang(en) .h1 { font-size: 24px }
  .sys { font-family: var(--font-body); font-size: 14px; line-height: 21px; color: var(--ink); border-left: 3px solid var(--vermilion); padding-left: 10px }
  .count { font-family: var(--font-display); font-size: 18px; line-height: 30px; font-weight: 700; color: var(--copper); white-space: nowrap; text-align: right }
  .count.full { color: var(--vermilion) }

  /* One row per item found (evidence and the mind-game card); a click takes it or puts it down. */
  .item { background-color: #fbf8ef; border: 1px solid #123a3166; border-left: 5px solid #9ea7aa; transition: background-color 120ms linear }
  .item:hover { background-color: #fff3cf }
  .item.psy { border-left-color: #6b3a7a }
  .item.sel { background-color: #e7f0e2; border: 2px solid #2f6b3a; border-left: 5px solid #2f6b3a }
  .box { border: 2px solid var(--ink); background-color: var(--paper) }
  .tick { display: none; background-color: #2f6b3a }
  .item.sel .tick { display: block }
  .it-n { font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 700; color: var(--ink-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  :lang(en) .it-n { font-size: 14px }
  .it-d { font-family: var(--font-body); font-size: 12px; line-height: 16px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .it-k { font-family: var(--font-body); font-size: 11px; line-height: 16px; color: var(--copper); white-space: nowrap; text-align: right }
  .item.psy .it-k { color: #6b3a7a }

  .btn { text-align: center; font-family: var(--font-display); font-size: 18px; line-height: 44px; font-weight: 700; letter-spacing: 2px;
         color: var(--paper); white-space: nowrap; background-color: var(--ink); border: 1px solid var(--ink-deep);
         box-shadow: 3px 3px 0px 0px #092e2866; transition: background-color 120ms linear }
  :lang(en) .btn { font-size: 16px; letter-spacing: 0px }
  .btn:hover { background-color: var(--copper) }
  .btn.red { background-color: var(--vermilion); border-color: #5c1913 }
  .btn.red:hover { background-color: #d23f35 }
  .btn.paper { color: var(--ink); background-color: var(--paper); border-color: var(--ink) }
  .btn.paper:hover { color: var(--paper); background-color: var(--ink) }

  /* Arthur's box (bottom): his comment on the current selection, one per press of the button. */
  .dlg { background-color: #092e28eb; border-top: 2px solid var(--copper); border-bottom: 2px solid var(--copper) }
  .who { font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 700; letter-spacing: 2px; color: var(--lamp-gold); white-space: nowrap }
  .say { font-family: var(--font-body); font-size: 18px; line-height: 26px; color: var(--paper) }
  :lang(en) .say { font-size: 16px; line-height: 23px }
  .more { font-family: var(--font-body); font-size: 12px; line-height: 16px; color: #f3eedf88; text-align: right; white-space: nowrap }

  .ask { background-color: var(--paper); border: 2px solid var(--copper); box-shadow: 3px 3px 0px 0px #092e2866; transition: background-color 120ms linear }
  .ask:hover { background-color: #fff3cf }
  .ask-t { font-family: var(--font-display); font-size: 17px; line-height: 22px; font-weight: 700; color: var(--ink-deep); text-align: center }
  :lang(en) .ask-t { font-size: 15px }

  .veil { background-color: #092e28b3 }
  .cbox { background-color: var(--paper); border: 2px solid var(--ink); box-shadow: 8px 8px 0px 0px #092e2899 }
  .c-t { font-family: var(--font-display); font-size: 19px; line-height: 30px; font-weight: 700; color: var(--ink-deep) }
  :lang(en) .c-t { font-size: 17px; line-height: 26px }
</style></helmet>
<div id="d1carry" data-xt-uiscale="fit" tabindex="0" autofocus key-activation="none"
     data-xt-port='phase:number in = 0; count_text:string in = ""; full:bool in = false; first_hint:string in = ""; items:list&lt;struct{id: string, name: string, desc: string, kind: string, psy: bool, sel: bool}&gt; in = []; who1:string in = ""; say1:string in = ""; who2:string in = ""; say2:string in = ""; say_seq:number in = 0; confirm_text:string in = ""; pick_item:string out = ""; ask:event out; confirm:event out; back:event out; yes:event out; no:event out; go:event out; settings:event out'
     data-xt-trigger="key(Escape):if port(phase) eq 1 emit(no) else emit(settings); key(F1):emit(settings); key(Enter):if port(phase) eq 2 emit(go); key(Space):if port(phase) eq 2 emit(go)"
     style="position: relative; width: 1280px; height: 720px; overflow: hidden; background-color: #092e28;">

  <img id="bg" src="/_blob/bg_d01_hall.jpg" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; object-fit: cover;">
  <div id="dim" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; background-color: #092e2899;"></div>

  <div id="main" style="position: absolute; left: calc(50% - 640px); top: calc(50% - 360px); width: 1280px; height: 720px;">
    <div id="sheet" class="sheet" style="position: absolute; left: 32px; top: 20px; width: 860px; height: 560px;">
      <div id="k" class="kicker" data-xt-key="SCR_D01_S06_TITLE" style="position: absolute; left: 24px; top: 10px; width: 500px; height: 20px;">整理帶走的證物</div>
      <div id="title" class="h1" data-xt-key="UI_V2_CARRY_TITLE" style="position: absolute; left: 24px; top: 30px; width: 520px; height: 38px;">整理帶走的證物</div>
      <div id="count" class="count" data-xt-bind="text=count_text; class.full=full" style="position: absolute; left: 456px; top: 36px; width: 380px; height: 30px;">可攜帶：9 件。已選：8 件。</div>
      <div id="hint" class="sys" data-xt-bind="text=first_hint; display=first_hint | ne('')" style="position: absolute; left: 24px; top: 74px; width: 800px; height: 21px;">能帶進論戰的東西有限。留下的證物，可能落入對手手中。</div>
      <div id="items" data-xt-repeat="items" style="position: absolute; left: 24px; top: 104px; width: 812px; height: 444px; display: flex; flex-direction: column; gap: 3px;">
        <div id="item" class="item" data-xt-bind="class.sel=item(sel); class.psy=item(psy)" data-xt-trigger="click(left):if port(phase) eq 0 set(pick_item, item(id))"
             style="position: relative; width: 812px; height: 31px; flex-shrink: 0;">
          <div id="it-box" class="box" style="position: absolute; left: 10px; top: 7px; width: 16px; height: 16px;">
            <div id="it-tick" class="tick" style="position: absolute; left: 2px; top: 2px; width: 8px; height: 8px;"></div>
          </div>
          <div id="it-n" class="it-n" data-xt-bind="text=item(name)" style="position: absolute; left: 36px; top: 5px; width: 230px; height: 20px;">黃銅文件筒（空）</div>
          <div id="it-d" class="it-d" data-xt-bind="text=item(desc)" style="position: absolute; left: 276px; top: 7px; width: 440px; height: 16px;">書桌上的黃銅文件筒，蓋子鎖著，裡面是空的。</div>
          <div id="it-k" class="it-k" data-xt-bind="text=item(kind)" style="position: absolute; left: 724px; top: 7px; width: 78px; height: 16px;">證物</div>
        </div>
      </div>
    </div>

    <!-- Right: Arthur, the Ask Arthur button, back and confirm. -->
    <div id="side" style="position: absolute; left: 912px; top: 20px; width: 336px; height: 560px;">
      <div id="arthur" style="position: absolute; left: 18px; top: 0px; width: 300px; height: 330px; overflow: hidden;">
        <img id="arthur-art" src="/_blob/char_arthur.png" style="position: absolute; left: 0px; top: 0px; width: 300px; height: 450px; object-fit: contain;">
      </div>
      <div id="btn-ask" class="ask" data-xt-trigger="click(left):if port(phase) eq 0 emit(ask)" style="position: absolute; left: 18px; top: 340px; width: 300px; height: 52px;">
        <div id="btn-ask-t" class="ask-t" data-xt-key="UI_V2_CARRY_ASK_ARTHUR" style="position: absolute; left: 8px; top: 15px; width: 284px; height: 22px;">問亞瑟的意見</div>
      </div>
      <div id="btn-back" class="btn paper" data-xt-key="BTN_BACK" data-xt-trigger="click(left):if port(phase) eq 0 emit(back)" style="position: absolute; left: 18px; top: 500px; width: 140px; height: 46px;">返回</div>
      <div id="btn-confirm" class="btn red" data-xt-key="UI_V2_CARRY_CONFIRM" data-xt-trigger="click(left):if port(phase) eq 0 emit(confirm)" style="position: absolute; left: 170px; top: 500px; width: 148px; height: 46px;">確定</div>
    </div>

    <!-- Arthur's box. -->
    <div id="dlg" class="dlg" data-xt-bind="display=say1 | ne('')" data-xt-trigger="port(say_seq):play(dlg-in)"
         data-xt-timeline="dlg-in: 0 opacity 0.3, 220ms ease-out opacity 1"
         style="position: absolute; left: 0px; top: 596px; width: 1280px; height: 116px;">
      <div id="who1" class="who" data-xt-bind="text=who1" style="position: absolute; left: 48px; top: 10px; width: 300px; height: 20px;">亞瑟</div>
      <div id="say1" class="say" data-xt-bind="text=say1" style="position: absolute; left: 48px; top: 30px; width: 1180px; height: 26px;">鎖匠的鑰匙不帶嗎？要是被誰拿去說嘴就麻煩了。</div>
      <div id="who2" class="who" data-xt-bind="text=who2; display=say2 | ne('')" style="position: absolute; left: 48px; top: 60px; width: 300px; height: 20px;">Sherefox</div>
      <div id="say2" class="say" data-xt-bind="text=say2; display=say2 | ne('')" style="position: absolute; left: 48px; top: 80px; width: 1180px; height: 26px;">它很輕。</div>
    </div>
  </div>

  <!-- Confirm: what will be left at the house (never what he picks up). -->
  <div id="confirm" data-xt-bind="display=phase | eq(1)" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;">
    <div id="c-veil" class="veil" data-xt-trigger="click(left):emit(no)" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;"></div>
    <div id="c-box" class="cbox" style="position: absolute; left: calc(50% - 330px); top: calc(50% - 130px); width: 660px; height: 260px;">
      <div id="c-k" class="kicker" data-xt-key="UI_V2_CARRY_LEFT_HEAD" style="position: absolute; left: 28px; top: 18px; width: 600px; height: 20px;">以下東西會留在現場</div>
      <div id="c-t" class="c-t" data-xt-bind="text=confirm_text" style="position: absolute; left: 28px; top: 46px; width: 604px; height: 124px;">以下東西會留在宅邸：落在地上的鏡子黑布、通靈板。確定嗎？</div>
      <div id="c-no" class="btn paper" data-xt-key="BTN_CANCEL" data-xt-trigger="click(left):emit(no)" style="position: absolute; left: 300px; top: 190px; width: 150px; height: 46px;">取消</div>
      <div id="c-yes" class="btn red" data-xt-key="BTN_OK" data-xt-trigger="click(left):emit(yes)" style="position: absolute; left: 470px; top: 190px; width: 162px; height: 46px;">確定</div>
    </div>
  </div>

  <!-- After confirming: Arthur's line about the left items plays in his box; a click anywhere goes on to the debate. -->
  <div id="post" data-xt-bind="display=phase | eq(2)" data-xt-trigger="click(left):emit(go)" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;">
    <div id="post-more" class="more" data-xt-key="BTN_CONTINUE" style="position: absolute; left: 1000px; top: 690px; width: 240px; height: 16px;">繼續</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script></body></html>
