<!doctype html>
<html><head><meta charset="utf-8"><title>D1Inv</title></head>
<body><x-dc>
<helmet><style>
  body { margin: 0; background: #092e28 }
  .bg-art { position: absolute; left: 0px; top: 0px; width: 100%; height: 100%; object-fit: cover; }
  .fig { position: absolute; object-fit: contain; }
  .kicker { font-family: var(--font-body); font-size: 13px; line-height: 20px; letter-spacing: 3px;
            text-transform: uppercase; color: var(--copper); white-space: nowrap }
  :lang(en) .kicker { letter-spacing: 1px }
  .hud-card { background-color: var(--paper); border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink);
              box-shadow: 3px 3px 0px 0px #092e2859 }

  /* Hotspots: an invisible hit box; the pencil ring, brass glow, type chip and name appear on hover (as v1). */
  .ring { opacity: 0; border: 2px solid #2e2f2dd9; border-radius: 50%;
          box-shadow: 0px 0px 22px 4px #e0a050a6; transition: opacity 140ms ease-out }
  .chip { width: 40px; height: 40px; flex-shrink: 0; opacity: 0; border-radius: 20px;
          background-color: #f3eedfeb; border: 2px solid var(--copper); transition: opacity 140ms ease-out }
  .spot-name { width: 240px; height: 26px; flex-shrink: 0; opacity: 0; text-align: center; white-space: nowrap;
               font-family: var(--font-body); font-size: 14px; line-height: 26px; color: var(--paper);
               background-color: #092e28d9; overflow: hidden; text-overflow: ellipsis; transition: opacity 140ms ease-out }
  .spot:hover .ring { opacity: 1 }
  .spot:hover .chip { opacity: 1 }
  .spot:hover .spot-name { opacity: 1 }
  .spot.done .ring { opacity: 0.45; border-color: #e3d9c299; box-shadow: 0px 0px 0px 0px #e0a05000 }
  .spot.done .chip { opacity: 0.85; border-color: #5b6662; background-color: #e3d9c2d9 }
  .spot.done .ico-done { display: block }
  .spot.done:hover .ring { opacity: 0.8 }
  .ico { position: absolute; left: 7px; top: 7px; width: 22px; height: 22px; object-fit: contain }
  .ico-done { display: none; position: absolute; left: 20px; top: 20px; width: 20px; height: 20px; object-fit: contain;
              background-color: var(--paper); border-radius: 10px }

  /* Location tabs (free movement between the six places). */
  .loc { background-color: #f3eedfe6; border: 1px solid var(--ink); border-top: 3px solid var(--ink);
         box-shadow: 2px 2px 0px 0px #092e2859; transition: background-color 120ms linear }
  .loc:hover { background-color: #fff3cf }
  .loc.sel { background-color: var(--ink); border-top-color: var(--vermilion) }
  .loc-t { font-family: var(--font-display); font-size: 15px; line-height: 18px; font-weight: 700; color: var(--ink-deep);
           text-align: center; line-clamp: 2 }
  :lang(en) .loc-t { font-size: 12px; line-height: 15px }
  .loc.sel .loc-t { color: var(--paper) }
  .loc-done { display: none; border-radius: 8px; background-color: var(--copper) }
  .loc.done .loc-done { display: block }

  .btn { height: 44px; flex-shrink: 0; text-align: center; line-height: 42px;
         font-family: var(--font-body); font-size: 16px; letter-spacing: 2px; color: var(--paper); white-space: nowrap;
         background-color: var(--ink); border: 1px solid var(--ink-deep); box-shadow: 3px 3px 0px 0px #092e2866;
         transition: background-color 120ms linear }
  :lang(en) .btn { font-size: 14px; letter-spacing: 0px }
  .btn:hover { background-color: var(--copper) }
  .btn:active { background-color: var(--ink-deep) }
  .btn.paper { color: var(--ink); background-color: var(--paper); border-color: var(--ink) }
  .btn.paper:hover { color: var(--paper); background-color: var(--ink) }
  .dot { border-radius: 12px; background-color: var(--vermilion); color: var(--paper); font-size: 13px; line-height: 24px;
         text-align: center; font-weight: 700; pointer-events: none }

  /* The spot's note: name, what Sherefox sees, Arthur's comment, what she takes. */
  .pop-title { font-family: var(--font-display); font-size: 24px; line-height: 32px; font-weight: 700; color: var(--ink-deep) }
  .pop-body { font-family: var(--font-body); font-size: 17px; line-height: 27px; color: var(--ink) }
  :lang(en) .pop-body { font-size: 16px; line-height: 24px }
  .pop-line { background-color: var(--paper-old); border-left: 3px solid var(--copper) }
  .pop-spk { font-family: var(--font-body); font-size: 13px; line-height: 18px; letter-spacing: 2px; font-weight: 700; color: var(--copper) }
  .pop-line-text { font-family: var(--font-body); font-size: 16px; line-height: 25px; color: var(--ink-deep) }
  .got { font-family: var(--font-display); font-size: 15px; line-height: 22px; font-weight: 700; color: var(--vermilion) }
</style></helmet>
<div id="d1inv" data-xt-uiscale="fit" tabindex="0" autofocus key-activation="none"
     data-xt-port='bg:string in = "parlour"; hud_title:string in = "蒐證"; appr_text:string in = "鑑定 剩 2 次"; locs:list&lt;struct{id: string, name: string, sel: bool, done: bool}&gt; in = [{"id":"PARLOR","name":"靈堂","sel":true,"done":false},{"id":"STUDY","name":"書房","sel":false,"done":false},{"id":"BASEMENT","name":"地下室（含廚房）","sel":false,"done":false},{"id":"ATTIC","name":"閣樓（含傭人房）","sel":false,"done":true},{"id":"BEDROOM","name":"塞德里克的臥室","sel":false,"done":false},{"id":"HALL","name":"門廳","sel":false,"done":false}]; spots:list&lt;struct{id: string, name: string, x: number, y: number, w: number, h: number, type: number, state: number}&gt; in = [{"id":"HS04","name":"遺體照","x":470,"y":42,"w":246,"h":216,"type":0,"state":1},{"id":"HS06","name":"門口的黑紗花圈","x":1166,"y":138,"w":108,"h":274,"type":1,"state":0}]; book_new:number in = 1; popup_on:bool in = false; popup_seq:number in = 0; popup_title:string in = "警督保管的箱子"; popup_body:string in = "警督把布里格斯的東西收在一個木箱裡：一圈萬用鑰匙，每一把都油亮亮的；一張工作單，字跡工整。"; popup_speaker:string in = "亞瑟"; popup_line:string in = "鑰匙全上了油。鎖匠的習慣。"; popup_got:string in = "取得：萬用鑰匙圈、布里格斯的工作單"; popup_note:string in = ""; spot:string out = ""; pick_loc:string out = ""; dismiss:event out; book:event out; notes:event out; end:event out; settings:event out'
     data-xt-trigger="key(Escape):if port(popup_on) eq true emit(dismiss) else emit(settings); key(Enter):if port(popup_on) eq true emit(dismiss); key(Space):if port(popup_on) eq true emit(dismiss); key(Tab):emit(book); key(N):emit(notes); key(F1):emit(settings)"
     style="position: relative; width: 1280px; height: 720px; overflow: hidden;
            background-color: #092e28; font-family: var(--font-body); color: #123a31;">

  <!-- The place and its hotspots share one 1280x720 box so the spot rectangles stay on the painting. -->
  <div id="scene" style="position: absolute; left: calc(50% - 640px); top: calc(50% - 360px); width: 1280px; height: 720px; overflow: hidden;">
    <div id="bg" data-xt-trigger="port(bg):play(bg-in)" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; background-color: #f3eedf;">
      <div id="bg-art" data-xt-timeline="bg-in: 0 opacity 0.35, 360ms ease-out opacity 1" style="position: absolute; left: 0px; top: 0px; width: 100%; height: 100%;">
        <img id="bg-parlour" class="bg-art" src="/_blob/bg_d01_parlour.jpg" data-xt-bind="display=bg | eq('parlour')">
        <img id="bg-study" class="bg-art" src="/_blob/bg_d01_study.jpg" data-xt-bind="display=bg | eq('study')">
        <img id="bg-basement" class="bg-art" src="/_blob/bg_d01_basement.jpg" data-xt-bind="display=bg | eq('basement')">
        <img id="bg-attic" class="bg-art" src="/_blob/bg_d01_attic.jpg" data-xt-bind="display=bg | eq('attic')">
        <img id="bg-bedroom" class="bg-art" src="/_blob/bg_d01_bedroom.jpg" data-xt-bind="display=bg | eq('bedroom')">
        <img id="bg-hall" class="bg-art" src="/_blob/bg_d01_hall.jpg" data-xt-bind="display=bg | eq('hall')">
        <!-- The people who can be questioned stand in their place (parlour: Cedric, Mrs Hyde, Irene; study door: Irene; hall: Briggs). -->
        <div id="figs-parlour" data-xt-bind="display=bg | eq('parlour')" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;">
          <img id="fig-cedric" class="fig" src="/_blob/char_cedric_composed.png" style="left: -10px; top: 300px; width: 280px; height: 420px;">
          <img id="fig-hyde" class="fig" src="/_blob/char_mrs_hyde.png" style="left: 255px; top: 300px; width: 280px; height: 420px;">
          <img id="fig-irene" class="fig" src="/_blob/char_irene.png" style="left: 700px; top: 300px; width: 280px; height: 420px;">
        </div>
        <div id="figs-study" data-xt-bind="display=bg | eq('study')" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;">
          <img id="fig-irene-door" class="fig" src="/_blob/char_irene.png" style="left: -60px; top: 260px; width: 260px; height: 390px;">
        </div>
        <div id="figs-hall" data-xt-bind="display=bg | eq('hall')" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;">
          <img id="fig-briggs" class="fig" src="/_blob/char_briggs.png" style="left: 740px; top: 290px; width: 287px; height: 430px;">
        </div>
      </div>
    </div>
    <div id="shade-top" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 120px;
         background: linear-gradient(180deg, #092e2880 0%, #092e2800 100%);"></div>

    <div id="spots-layer" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;">
      <div id="spots-list" data-xt-repeat="spots" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;">
        <div id="spot" class="spot"
             data-xt-bind="translate-x=item(x); translate-y=item(y); width=item(w) | range(0, 1280, 0px, 1280px); height=item(h) | range(0, 720, 0px, 720px); class.done=item(state) | eq(1)"
             data-xt-trigger="click(left):if port(popup_on) eq false set(spot, item(id))"
             style="position: absolute; left: 0px; top: 0px; width: 124px; height: 62px;
                    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
          <div id="spot-ring" class="ring" style="position: absolute; left: -6px; top: -6px; right: -6px; bottom: -6px;"></div>
          <div id="spot-chip" class="chip" style="position: relative;">
            <img id="ico-look" class="ico" src="/_blob/ico_look.png" data-xt-bind="display=item(type) | eq(0)">
            <img id="ico-item" class="ico" src="/_blob/ico_item.png" data-xt-bind="display=item(type) | eq(1)">
            <img id="ico-talk" class="ico" src="/_blob/ico_talk.png" data-xt-bind="display=item(type) | eq(2)">
            <img id="ico-done" class="ico-done" src="/_blob/ico_check.png">
          </div>
          <div id="spot-name" class="spot-name" data-xt-bind="text=item(name)">遺體照</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Top left: the scene heading and the appraisals left. -->
  <div id="hud" class="hud-card" style="position: absolute; left: 16px; top: 10px; width: 200px; height: 56px; padding: 4px 12px 4px 12px;">
    <div id="hud-title" class="kicker" data-xt-bind="text=hud_title" style="position: absolute; left: 12px; top: 4px; width: 176px; height: 20px;">蒐證</div>
    <div id="hud-appr" data-xt-bind="text=appr_text"
         style="position: absolute; left: 12px; top: 25px; width: 176px; height: 24px; font-family: var(--font-display); font-size: 16px; line-height: 24px; font-weight: 700; color: #a65432; white-space: nowrap;">鑑定 剩 2 次</div>
  </div>

  <!-- Top: the six places (click to go there; a copper dot once every spot there has been looked at). -->
  <div id="locs" data-xt-repeat="locs" style="position: absolute; left: 232px; top: 10px; width: 1032px; height: 56px; display: flex; flex-direction: row; gap: 6px;">
    <div id="loc" class="loc" data-xt-bind="class.sel=item(sel); class.done=item(done)"
         data-xt-trigger="click(left):if port(popup_on) eq false set(pick_loc, item(id))"
         style="position: relative; width: 167px; height: 56px; flex-shrink: 0;">
      <div id="loc-t" class="loc-t" data-xt-bind="text=item(name)" style="position: absolute; left: 6px; top: 8px; width: 155px; height: 36px;">靈堂</div>
      <div id="loc-done" class="loc-done" style="position: absolute; left: 151px; top: 4px; width: 10px; height: 10px;"></div>
    </div>
  </div>

  <!-- Bottom right: evidence list, notes on people, end the search (-> the carry screen). -->
  <div id="actions" data-xt-anchor="bottom-right" style="position: absolute; right: 16px; bottom: 16px; width: 560px; height: 52px;">
    <div id="btn-book" class="btn paper" data-xt-key="UI_V2_EVLIST" data-xt-trigger="click(left):emit(book)"
         style="position: absolute; left: 0px; top: 4px; width: 176px;">證物清單</div>
    <div id="book-dot" class="dot" data-xt-bind="display=book_new | gt(0); text=book_new"
         style="position: absolute; left: 160px; top: -6px; width: 24px; height: 24px;">1</div>
    <div id="btn-notes" class="btn paper" data-xt-key="UI_V2_NOTES_PAGE" data-xt-trigger="click(left):emit(notes)"
         style="position: absolute; left: 192px; top: 4px; width: 176px;">人物筆記</div>
    <div id="btn-end" class="btn" data-xt-key="BTN_INV_END" data-xt-trigger="click(left):emit(end)"
         style="position: absolute; left: 384px; top: 4px; width: 176px;">結束蒐證</div>
  </div>

  <!-- The spot's note (a click anywhere closes it). -->
  <div id="pop" data-xt-bind="display=popup_on" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px;">
    <div id="pop-shade" data-xt-trigger="click(left):emit(dismiss)"
         style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; background-color: #092e288c;"></div>
    <div id="pop-card" class="hud-card" data-xt-trigger="port(popup_seq):play(pop-in)"
         data-xt-timeline="pop-in: 0 opacity 0, 0 transform translate(0px, 16px), 220ms ease-out opacity 1, 220ms ease-out transform translate(0px, 0px)"
         style="position: absolute; left: 330px; top: 150px; width: 620px; pointer-events: none;
                display: flex; flex-direction: column; gap: 8px; padding: 18px 28px 18px 28px;">
      <div id="pop-kicker" class="kicker" data-xt-bind="text=hud_title" style="width: 564px; height: 20px; flex-shrink: 0;">蒐證</div>
      <div id="pop-title" class="pop-title" data-xt-bind="text=popup_title" style="width: 564px; flex-shrink: 0;">警督保管的箱子</div>
      <div id="pop-rule" style="width: 564px; height: 1px; flex-shrink: 0; background-color: #123a31;"></div>
      <div id="pop-body" class="pop-body" data-xt-bind="text=popup_body" style="width: 564px; flex-shrink: 0;">警督把布里格斯的東西收在一個木箱裡：一圈萬用鑰匙，每一把都油亮亮的；一張工作單，字跡工整。</div>
      <div id="pop-line" class="pop-line" data-xt-bind="display=popup_line | ne('')"
           style="width: 564px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px 8px 12px;">
        <div id="pop-spk" class="pop-spk" data-xt-bind="text=popup_speaker" style="width: 540px; flex-shrink: 0;">亞瑟</div>
        <div id="pop-line-text" class="pop-line-text" data-xt-bind="text=popup_line" style="width: 540px; flex-shrink: 0;">鑰匙全上了油。鎖匠的習慣。</div>
      </div>
      <div id="pop-got" class="got" data-xt-bind="text=popup_got; display=popup_got | ne('')" style="width: 564px; flex-shrink: 0;">取得：萬用鑰匙圈、布里格斯的工作單</div>
      <div id="pop-note" class="got" data-xt-bind="text=popup_note; display=popup_note | ne('')" style="width: 564px; flex-shrink: 0;">記下了一條人物筆記。</div>
      <div id="pop-close" data-xt-key="BTN_CLOSE" style="width: 564px; height: 22px; flex-shrink: 0; text-align: right; font-size: 13px; line-height: 22px; letter-spacing: 2px; color: #a65432;">關閉</div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script></body></html>
