[project]
name = "sherefox-ref"
version = "0.1.0"
description = "Executable reference model (golden oracle) of the Sherefox debate rules, Ch.1-3"
readme = "README.md"
authors = [
    { name = "z060142", email = "z060142@yahoo.com.tw" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
